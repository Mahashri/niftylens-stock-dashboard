name: Daily CMP refresh
on:
  schedule:
    # 15:50 Asia/Kolkata (10:20 UTC), weekdays after NSE close.
    - cron: "20 10 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-cmp-refresh
  cancel-in-progress: false
jobs:
  refresh-cmp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests
      - name: Fetch daily closing prices
        run: python scripts/update_market_data.py
      - name: Commit refreshed market data
        run: |
          if git diff --quiet -- market-data.json; then
            echo "No market-data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-data.json
          git commit -m "chore: refresh daily CMP data"
          git push
